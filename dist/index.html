<!doctype html>
<html lang="en" class="light" style="background:#f5f5f5;color-scheme:light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Set theme BEFORE any JS runs. Follow the OS unless the user explicitly chose light/dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // No stored choice (or 'system') → follow the operating system.
          var dark = t === 'dark' || ((!t || t === 'system') && prefersDark);
          var html = document.documentElement;
          html.classList.toggle('dark', dark);
          html.classList.toggle('light', !dark);
          html.style.backgroundColor = dark ? '#141414' : '#f5f5f5';
          html.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Light mode background until React mounts — matches Yandex Go */
      html, body { background: #f5f5f5; }
      html.dark, html.dark body { background: #141414; }
    </style>
    <title>EverySub — Subscriptions in Roatán</title>
    <meta name="description" content="Subscriptions for life on Roatán — meals, cleaning, memberships, vehicles and more, paid by Lightning, Bitcoin, card or PayPal." />
    <meta name="author" content="EverySub" />
    <meta name="keywords" content="roatan, subscriptions, services, cleaning, meals, bay islands, honduras, bitcoin, lightning" />

    <!-- Open Graph -->
    <meta property="og:title" content="EverySub — Subscriptions in Roatán" />
    <meta property="og:description" content="Subscriptions for life on Roatán — meals, cleaning, memberships, vehicles and more, paid by Lightning, Bitcoin, card or PayPal." />
    <meta property="og:site_name" content="EverySub" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://everysub.net" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EverySub — Subscriptions in Roatán" />
    <meta name="twitter:description" content="Subscriptions for life on Roatán — meals, cleaning, memberships, vehicles and more, paid by Lightning, Bitcoin, card or PayPal." />

    <!-- Icons. There was no <link rel="icon"> at all: browsers were falling back
         to the /favicon.ico convention, and iOS had nothing to use for a home
         screen shortcut, so it screenshotted the page instead. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#F8A31A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EverySub" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Inter Variable — single request covering every weight 100–900 with optical sizing -->
    <!-- Inter is bundled (src/main.tsx → @fontsource-variable/inter): served from
         our own origin with the app's year-long cache, instead of a render-blocking
         stylesheet from fonts.googleapis.com plus a second domain for the files. -->
    <!-- Warm the connection to Supabase while the JS downloads: the first
         catalogue query and the first photo then skip DNS + TLS (~200–400 ms).
         Two lines because fetch() (CORS) and <img> use separate connections. -->
    <link rel="preconnect" href="https://igbytraidldkhhamsfdo.supabase.co" crossorigin>
    <link rel="preconnect" href="https://igbytraidldkhhamsfdo.supabase.co">
    <script type="module" crossorigin src="/assets/index-Dt-AuRxb.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-B9GJ1coB.js">
    <link rel="modulepreload" crossorigin href="/assets/supabase-BmzUnhA0.js">
    <link rel="stylesheet" crossorigin href="/assets/vendor-DreOFYE_.css">
    <link rel="stylesheet" crossorigin href="/assets/index-DbzjFJae.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Force-clear stale SW caches on first load after deploy
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            if (name !== 'prosperasub-v3') caches.delete(name);
          });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.update(); });
        });
      }
    </script>
  </body>
</html>
